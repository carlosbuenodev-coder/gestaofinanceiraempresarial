name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ./tests/GestaoFinanceira.Tests/GestaoFinanceira.Tests.csproj
      - run: dotnet build ./GestaoFinanceira.csproj --configuration Release --no-restore
      - run: dotnet test ./tests/GestaoFinanceira.Tests/GestaoFinanceira.Tests.csproj --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
        env:
          VITEST_MAX_WORKERS: '1'
      - run: npm run build
